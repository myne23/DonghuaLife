name: Diagnóstico Kino SDK

on:
  push:
    branches: [diagnostico-sdk]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout DonghuaLife
        uses: actions/checkout@v4
      - name: Checkout SDK oficial de Kino
        uses: actions/checkout@v4
        with:
          repository: kinotvapp/kino-plugin-archive
          path: kino-sdk
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Comparar acceso a dominio principal y beta
        run: |
          for host in donghualife.com beta.donghualife.com; do
            for path in / /series /series/against-sky-supreme; do
              printf '%s%s -> ' "https://$host" "$path"
              curl -L -sS -o /tmp/donghua-page -w '%{http_code} (%{size_download} bytes)\n' --max-time 20 "https://$host$path" || true
            done
          done
      - name: Ejecutar pruebas de regresión del plugin
        run: node test/smoke-test.mjs
      - name: Validar contrato y manifiesto
        run: node kino-sdk/sdk/validate.mjs .
      - name: Probar Inicio con datos reales y exigir las cinco filas
        run: |
          for attempt in 1 2 3; do
            node kino-sdk/sdk/run.mjs ./plugin.js home > /tmp/home.json || true
            if node --input-type=module -e 'import fs from "node:fs"; let rows=[]; try { rows=JSON.parse(fs.readFileSync("/tmp/home.json","utf8")); } catch {} const expected=["Últimos Episodios","Tendencias","Series Finalizadas","Películas","Catálogo completo de A-Z"]; const actual=Array.isArray(rows)?rows.map(r=>r.title):[]; if (actual.join("|") !== expected.join("|")) { console.error("Orden o categorías de Inicio incorrectos:", actual); process.exit(1); } console.log("Filas reales de Inicio:", actual.join(" | "));'; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Probar navegación Ver más de Últimos Episodios
        run: node kino-sdk/sdk/run.mjs ./plugin.js browse ultimos-episodios 1
      - name: Probar navegación Ver más de Series Finalizadas
        run: node kino-sdk/sdk/run.mjs ./plugin.js browse series-finalizadas 1
      - name: Probar navegación Ver más de Películas
        run: node kino-sdk/sdk/run.mjs ./plugin.js browse peliculas 1
      - name: Probar navegación Ver más de Catálogo A-Z
        run: node kino-sdk/sdk/run.mjs ./plugin.js browse catalogo-az 1
      - name: Probar búsqueda real
        run: node kino-sdk/sdk/run.mjs ./plugin.js search "Against Sky Supreme"
      - name: Probar episodios con la referencia real de una tarjeta
        run: node kino-sdk/sdk/run.mjs ./plugin.js episodes "against-sky-supreme"
